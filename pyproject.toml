[project]
name = "safe-paste"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raven", email = "realveenna@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "keyboard>=0.13.5",
    "pyperclip>=1.11.0",
]

[project.scripts]
safe-paste = "safe_paste:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
